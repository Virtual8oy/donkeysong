<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donkey Song</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0d1117;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;

            text-align: center;

            background: #161b22;

            padding: 40px 25px;

            border-radius: 25px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .play-button {

            width: 130px;
            height: 130px;

            border-radius: 50%;

            border: none;

            background: white;
            color: black;

            font-size: 45px;

            cursor: pointer;

            transition: 0.2s;
        }

        .play-button:active {
            transform: scale(0.92);
        }

        audio {
            width: 100%;
            margin-top: 35px;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

    </style>
</head>


<body>

<div class="container">

    <h1>🎵 Donkey Song</h1>

    <p>Premi Play per ascoltare</p>

    <button
        class="play-button"
        id="playButton"
        onclick="toggleAudio()">
        ▶
    </button>

    <audio id="audio" controls preload="auto">

        <source
            src="audio/song.mp3"
            type="audio/mpeg">

        Il tuo browser non supporta la riproduzione audio.

    </audio>

    <div class="status" id="status">
        Pronto
    </div>

</div>


<script>

const audio = document.getElementById("audio");
const button = document.getElementById("playButton");
const status = document.getElementById("status");


function toggleAudio() {

    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();

    }

}


audio.addEventListener("play", () => {

    button.innerHTML = "⏸";
    status.innerHTML = "Riproduzione in corso...";

});


audio.addEventListener("pause", () => {

    button.innerHTML = "▶";
    status.innerHTML = "In pausa";

});


audio.addEventListener("ended", () => {

    button.innerHTML = "▶";
    status.innerHTML = "Fine";

});

</script>

</body>
</html>
